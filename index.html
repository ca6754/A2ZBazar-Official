<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRICKET ID PROFIT AND SHARING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #1c1d1f;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-img-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 24px auto;
            border-radius: 50%;
            overflow: hidden;
            background-color: #111;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .subscribers {
            color: #8e8e93;
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .description {
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.4;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        .join-btn {
            display: inline-block;
            background-color: #1da1f2;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            padding: 14px 36px;
            border-radius: 30px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(29, 161, 242, 0.3);
        }

        .join-btn:hover {
            background-color: #1a91da;
        }

        .join-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img-container">
            <!-- Profile photo ka URL/path yahan badle -->
            <img src="https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=300&auto=format&fit=crop" alt="Profile" class="profile-img">
        </div>
        
        <h1 class="title">CRICKET ID PROFIT AND SHARING</h1>
        
        <p class="subscribers">1 subscriber</p>
        
        <p class="description">
            JIS BHAI KO CRICKET ID ME LOSS HAI VO HAMARE WATSAPP NUMBER PAR MASSAGE KIJIYE 🙏
        </p>
        
        <!-- Apne Telegram ya WhatsApp group ka link 'href' me dale -->
        <a href="https://t.me/your_channel_link" class="join-btn">JOIN CHANNEL</a>
    </div>

</body>
</html>
