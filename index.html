<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A TO Z BAZAR - Official App</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fdf2f4;
            --card-bg: #ffffff;
            --primary: #d91b49;
            --primary-dark: #ad0d33;
            --primary-light: #fff0f3;
            --text-dark: #2c2c2c;
            --text-muted: #666666;
            --border-color: #f3c6d1;
            --star-gold: #ffb400;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 15px 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header Navigation */
        .navbar {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(217, 27, 73, 0.06);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .menu-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--primary);
            font-size: 14px;
            cursor: pointer;
        }

        /* Hero Card */
        .hero-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(217, 27, 73, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-badge {
            display: inline-block;
            border: 1px dashed var(--primary);
            color: var(--primary);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .main-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .main-title span {
            color: var(--primary-dark);
        }

        .description {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Image Box */
        .image-wrapper {
            width: 100%;
            max-width: 280px;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 8px;
            background: #fff;
            margin-bottom: 16px;
        }

        .hero-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            object-fit: cover;
        }

        .img-caption {
            font-size: 9px;
            font-weight: 700;
            color: var(--primary);
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* CTA Buttons */
        .cta-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
