<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2Z Bazar - Official MTK app</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0e12;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(29, 161, 242, 0.15) 0%, transparent 60%),
                linear-gradient(to bottom, #0d0e12, #050507);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            background: rgba(24, 26, 32, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 50px 32px 32px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        0 0 40px rgba(0, 136, 204, 0.1);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glowing Avatar */
        .profile-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 28px auto;
        }

        .profile-img-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0088cc;
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.5);
            position: relative;
            z-index: 2;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Main Heading */
        .title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Subscribers Count Badge */
        .subscribers {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a0a5b5;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background-color: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
        }

        /* Description Box */
        .description-card {
            background: rgba(15, 17, 21, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 22px 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .description {
            color: #e2e8f0;
            font-size: 16px;
            font-weight: 600;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }

        /* Download App Button */
        .download-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0088cc 0%, #00a8ff 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            border: none;
            cursor: pointer;
        }

        .download-btn i {
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        /* Light Sweep Effect */
        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.6s ease;
        }

        /* Hover & Active States */
        .download-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 136, 204, 0.6);
            background: linear-gradient(135deg, #0099e6 0%, #1ab1ff 100%);
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover i {
            transform: translateY(3px) scale(1.15);
        }

        .download-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .main-container {
                padding: 35px 20px 25px 20px;
            }
            .title {
                font-size: 22px;
            }
            .profile-wrapper {
                width: 130px;
                height: 130px;
            }
            .description {
                font-size: 14px;
            }
            .download-btn {
                font-size: 16px;
                padding: 16px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Profile Picture Container -->
        <div class="profile-wrapper">
            <div class="profile-img-container">
                <img src="profile.jpg" alt="Profile" class="profile-img">
            </div>
        </div>

        <!-- Title -->
        <h1 class="title">🙏A2Z Bazar - Official MTK app🙏</h1>

        <!-- Subscribers Count Badge -->
        <div class="subscribers">
            <span class="status-dot"></span>
            <span>50,000 subscribers</span>
        </div>

        <!-- Description Box -->
        <div class="description-card">
            <div class="description">
                ✅ Easy to Use Interface ✔<br>
                ✅ Live Data Updates ✔️<br>
                ✅ Smart Number Insights ✔️<br>
                ✅ 24x7 Support ✔️<br><br>
                💥Join Now & Start Exploring Today💥
            </div>
        </div>

        <!-- Download App Button -->
        <a href="https://atozbazar.fun" target="_blank" class="download-btn">
            <i class="fa-solid fa-download"></i>
            <span>DOWNLOAD APP</span>
        </a>
    </div>

</body>
</html>
